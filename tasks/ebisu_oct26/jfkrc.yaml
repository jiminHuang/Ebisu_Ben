task: ebisu_jfkrc
tag: ebisu_oct26_long
dataset_path: json
dataset_kwargs:
  data_files:
    test: /remote_dir/home/qianqianxie/ebisu/data/JF-KRC-3/jf_krc_merged_release_compact_v2b.jsonl
test_split: test
output_type: generate_until
doc_to_text: '{{query}}'
doc_to_target: '{{answer}}'
generation_kwargs:
  until:
    - "@@"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1024
