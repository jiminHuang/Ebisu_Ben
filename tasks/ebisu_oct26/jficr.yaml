# JF-ICR on the 303-row release (TheFinAI/jp-icr, JF-ICR_test_hf_ready_303.jsonl)
task: ebisu_jficr
tag: ebisu_oct26
dataset_path: json
dataset_kwargs:
  data_files:
    test: /remote_dir/home/qianqianxie/ebisu/data/jp-icr/JF-ICR_test_hf_ready_303.jsonl
test_split: test
output_type: generate_until
doc_to_text: '{{query}}'
doc_to_target: '{{answer}}'
generation_kwargs:
  until:
    - "@@"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 512  # same as the collaborators' JFICT_gen.yaml
filter_list:
  - name: "score-first"
    filter:
      - function: "regex"
        regex_pattern: '([+\-][012]|0)'
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: '2.0'
